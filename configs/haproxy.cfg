global
  log /dev/log local0
  log /dev/log local1 notice
  maxconn 20000
  user haproxy
  group haproxy
  daemon
  stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

  tune.ssl.default-dh-param 2048

  ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384


defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout http-keep-alive 30s

frontend http_in
  bind *:80
  acl allowed_host hdr(host),lower -m reg -f /etc/haproxy/maps/domains.map
  http-request deny if !allowed_host
  http-request set-header X-Forwarded-For %[src]
  default_backend cloudflare_http

frontend https_in
  bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
  acl allowed_sni ssl_fc_sni,lower -m reg -f /etc/haproxy/maps/domains.map
  http-request deny if !allowed_sni
  http-request set-header X-Forwarded-For %[src]
  default_backend cloudflare_https

backend cloudflare_http
  balance roundrobin
  option http-keep-alive
  default-server inter 3s fall 3 rise 2
  server-template cf 1-20 0.0.0.0:80

backend cloudflare_https
  balance roundrobin
  option http-keep-alive
  default-server inter 3s fall 3 rise 2 ssl verify none
  server-template cf 1-20 0.0.0.0:443 ssl verify none sni req.hdr(host)
