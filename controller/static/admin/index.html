<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CF Relay 管理后台</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#2563eb;--ok:#16a34a}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial;background:var(--bg);color:var(--text)}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}.title{font-size:24px;font-weight:700}.muted{color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
    .col-4{grid-column:span 4}.col-6{grid-column:span 6}.col-12{grid-column:span 12}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} input,button,select{border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#111827;padding:8px}
    button{cursor:pointer;background:var(--primary);color:#fff;border-color:var(--primary)} button.secondary{background:#fff;color:#111827}
    table{width:100%;border-collapse:collapse;font-size:13px} th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
    .pill{padding:2px 8px;border-radius:999px;font-size:12px;background:#ecfeff;color:#155e75}.circle{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
    #app{display:none} #loginBox{max-width:430px;margin:12vh auto;background:var(--card);padding:20px;border-radius:12px;border:1px solid var(--line)} .page{display:none}.page.active{display:block}
    textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px}
  </style>
</head>
<body>
<div class="wrap">
  <div id="loginBox">
    <div class="title">CF Relay 管理后台登录</div>
    <div class="muted">默认账号 admin / admin123</div>
    <div class="row" style="margin-top:12px"><input id="username" placeholder="用户名" value="admin" style="flex:1"></div>
    <div class="row" style="margin-top:8px"><input id="password" type="password" placeholder="密码" value="admin123" style="flex:1"></div>
    <div class="row" style="margin-top:12px"><button onclick="login()">登录</button><span id="loginMsg" class="muted"></span></div>
  </div>

  <div id="app">
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <div class="title">CF Relay 管理后台</div>
      <div class="row">
        <button class="secondary" onclick="openPage('home')">首页</button>
        <button class="secondary" onclick="openPage('cert')">证书中心</button>
        <button class="secondary" onclick="openPage('settings')">设置</button>
        <button class="secondary" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div id="page-home" class="page active">
      <div class="grid">
        <div class="card col-4"><h3>CPU 总体监控</h3><div id="cpuCircle" class="circle"></div><div id="cpuText" class="muted"></div></div>
        <div class="card col-4"><h3>内存总体监控</h3><div id="memCircle" class="circle"></div><div id="memText" class="muted"></div></div>
        <div class="card col-4"><h3>带宽总体监控</h3><div id="bwCircle" class="circle"></div><div id="bwText" class="muted"></div></div>

        <div class="card col-12">
          <h3>新增节点（自动生成一键安装/卸载命令）</h3>
          <div class="row"><input id="nodeName" placeholder="节点名称" style="flex:1"><input id="controllerUrl" placeholder="主控地址，例如 http://1.2.3.4" style="flex:1"><button onclick="createNodeCmd()">生成命令</button></div>
          <div class="muted" style="margin-top:8px">安装命令</div><textarea id="installCmd" readonly></textarea>
          <div class="muted" style="margin-top:8px">卸载命令</div><textarea id="uninstallCmd" readonly></textarea>
        </div>

        <div class="card col-12">
          <h3>节点列表</h3>
          <table><thead><tr><th>名称</th><th>地址</th><th>在线</th><th>CPU%</th><th>内存MB</th><th>带宽Mbps</th><th>最大带宽测速</th></tr></thead><tbody id="nodesT"></tbody></table>
        </div>
      </div>
    </div>

    <div id="page-settings" class="page">
      <div class="grid">
        <div class="card col-6"><h3>系统设置</h3>
          <div class="row"><input id="setPort" placeholder="主控端口" style="width:120px"><input id="setPath" placeholder="面板路径" style="width:150px"></div>
          <div class="row" style="margin-top:8px"><input id="setUser" placeholder="默认账号" style="width:180px"><input id="setPwd" placeholder="默认密码" style="width:180px"></div>
          <div class="row" style="margin-top:8px"><button onclick="saveSettings()">保存设置</button><span id="setMsg" class="muted"></span></div>
        </div>
        <div class="card col-6"><h3>同步配置</h3><button onclick="syncAll()">立即同步全部配置到所有节点</button><pre id="syncOut" class="muted"></pre></div>
        <div class="card col-6"><h3>域名白名单</h3><div class="row"><input id="domainIn" placeholder="example.com" style="flex:1"><button onclick="addDomain()">添加</button></div><div id="domains" class="muted" style="margin-top:8px"></div></div>
        <div class="card col-6"><h3>Cloudflare IP 池</h3><div class="row"><input id="cfIpIn" placeholder="1.1.1.1" style="flex:1"><input id="cfPortIn" value="443" style="width:90px"><button onclick="addCfIp()">添加</button></div><div id="cfips" class="muted" style="margin-top:8px"></div></div>
      </div>
    </div>

    <div id="page-cert" class="page">
      <div class="card"><h3>证书中心</h3>
        <div class="row"><input id="certDomain" placeholder="example.com" style="flex:1"><select id="certMode"><option value="http">http</option><option value="dns">dns</option></select><button onclick="applyCert()">申请/重试</button></div>
        <table style="margin-top:8px"><thead><tr><th>域名</th><th>状态</th><th>重试</th></tr></thead><tbody id="certT"></tbody></table>
      </div>
    </div>
  </div>
</div>
<script>
let token = localStorage.getItem('cf_token') || '';
const base = `${location.pathname.replace(/\/$/, '')}/api`;
function hdr(){return {'Content-Type':'application/json','Authorization':`Bearer ${token}`};}
async function api(path,opt={}){const r=await fetch(base+path,opt); if(!r.ok) throw new Error(await r.text()); return r.json();}
function openPage(name){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(`page-${name}`).classList.add('active');}
function drawCircle(id,p){const pct=Math.max(0,Math.min(100,Math.round(p)));const el=document.getElementById(id);el.style.background=`conic-gradient(#2563eb ${pct}%, #e5e7eb ${pct}% 100%)`;el.textContent=`${pct}%`;}
async function login(){
  const username=document.getElementById('username').value; const password=document.getElementById('password').value;
  try{const r=await fetch(base+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}); if(!r.ok) throw new Error(await r.text()); const j=await r.json(); token=j.access_token; localStorage.setItem('cf_token',token); document.getElementById('loginBox').style.display='none'; document.getElementById('app').style.display='block'; refreshAll();}
  catch(e){document.getElementById('loginMsg').textContent='登录失败: '+e.message;}
}
function logout(){localStorage.removeItem('cf_token');location.reload();}
async function refreshAll(){
  const o=await api('/dashboard/overview',{headers:hdr()});
  const cpuP=o.totals?.cpu_cores?((o.totals.cpu_used_cores_est/o.totals.cpu_cores)*100):0;
  const memP=o.totals?.memory_mb?((o.totals.memory_used_mb/o.totals.memory_mb)*100):0;
  const bwP=o.totals?.bandwidth_mbps?((o.totals.bandwidth_used_mbps/o.totals.bandwidth_mbps)*100):0;
  drawCircle('cpuCircle',cpuP); drawCircle('memCircle',memP); drawCircle('bwCircle',bwP);
  cpuText.textContent=`已用 ${o.totals?.cpu_used_cores_est||0}/${o.totals?.cpu_cores||0} 核`; memText.textContent=`已用 ${o.totals?.memory_used_mb||0}/${o.totals?.memory_mb||0} MB`; bwText.textContent=`已用 ${o.totals?.bandwidth_used_mbps||0}/${o.totals?.bandwidth_mbps||0} Mbps`;
  const nodes=await api('/nodes',{headers:hdr()});
  nodesT.innerHTML=nodes.map(n=>`<tr><td>${n.name}</td><td>${n.endpoint}</td><td><span class="pill">${n.online?'online':'offline'}</span></td><td>${n.used_cpu_percent||0}</td><td>${n.used_memory_mb||0}/${n.memory_mb||0}</td><td>${n.used_bandwidth_mbps||0}/${n.max_bandwidth_mbps||0}</td><td><button onclick="speedtestNode('${n.name}')">重测</button></td></tr>`).join('');
  const domains=await api('/whitelist',{headers:hdr()}); document.getElementById('domains').textContent=domains.map(x=>x.domain).join(', ')||'(空)';
  const cf=await api('/cf-ips',{headers:hdr()}); document.getElementById('cfips').textContent=cf.map(x=>`${x.ip}:${x.port}`).join(', ')||'(空)';
  const certs=await api('/certificates',{headers:hdr()}); certT.innerHTML=certs.map(c=>`<tr><td>${c.domain}</td><td>${c.status}</td><td><button onclick="retryCert('${c.domain}')">重试</button></td></tr>`).join('');
  const s=await api('/settings',{headers:hdr()}); setPort.value=s.controller_port; setPath.value=s.admin_path; setUser.value=s.default_admin_user; setPwd.value=s.default_admin_password;
}
async function createNodeCmd(){const r=await api('/nodes/onboard',{method:'POST',headers:hdr(),body:JSON.stringify({node_name:nodeName.value,controller_url:controllerUrl.value})});installCmd.value=r.install_command;uninstallCmd.value=r.uninstall_command;}
async function speedtestNode(name){const r=await api(`/nodes/${name}/speedtest`,{method:'POST',headers:hdr()});alert(`下行:${r.download_mbps} 上行:${r.upload_mbps} 生效最大:${r.effective_mbps}`);refreshAll();}
async function addDomain(){await api('/whitelist',{method:'POST',headers:hdr(),body:JSON.stringify({domain:domainIn.value})}); refreshAll();}
async function addCfIp(){await api('/cf-ips',{method:'POST',headers:hdr(),body:JSON.stringify({ip:cfIpIn.value,port:Number(cfPortIn.value||443)})}); refreshAll();}
async function saveSettings(){const r=await api('/settings',{method:'POST',headers:hdr(),body:JSON.stringify({controller_port:Number(setPort.value),admin_path:setPath.value,default_admin_user:setUser.value,default_admin_password:setPwd.value})}); setMsg.textContent=r.message;}
async function applyCert(){await api('/certificates/manual',{method:'POST',headers:hdr(),body:JSON.stringify({domain:certDomain.value,verify_mode:certMode.value})}); refreshAll();}
async function retryCert(domain){await api(`/certificates/${domain}/retry`,{method:'POST',headers:hdr()}); refreshAll();}
async function syncAll(){const r=await api('/sync',{method:'POST',headers:hdr()}); syncOut.textContent=JSON.stringify(r,null,2);}
if(token){document.getElementById('loginBox').style.display='none';document.getElementById('app').style.display='block';refreshAll().catch(()=>logout());}
</script>
</body>
</html>
